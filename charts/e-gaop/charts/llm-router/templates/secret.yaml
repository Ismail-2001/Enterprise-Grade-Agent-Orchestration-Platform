{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: e-gaop
type: Opaque
data:
  {{- if .Values.openaiApiKey }}
  openai-api-key: {{ .Values.openaiApiKey | b64enc | quote }}
  {{- else }}
  openai-api-key: ""
  {{- end }}
  {{- if .Values.anthropicApiKey }}
  anthropic-api-key: {{ .Values.anthropicApiKey | b64enc | quote }}
  {{- else }}
  anthropic-api-key: ""
  {{- end }}
{{- end }}
