enabled: true
image: egaop/llm-router
tag: latest
replicas: 2
grpcPort: 50053
healthPort: 15053
rateLimitRpm: 30
fallbackChain: "gpt-4o,gpt-4o-mini,gpt-3.5-turbo"
llmTimeoutMs: "30000"
llmMaxRetries: "3"
llmMaxConcurrent: "25"
openaiApiKey: ""
anthropicApiKey: ""
anthropicBaseUrl: "https://api.anthropic.com"
ollamaBaseUrl: "http://localhost:11434"
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
serviceMonitor:
  enabled: false
tls:
  certManager:
    enabled: false
