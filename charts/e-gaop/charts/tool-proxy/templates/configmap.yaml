{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tool-proxy
  namespace: {{ .Release.Namespace }}
data:
  TOOL_PROXY_PORT: "{{ .Values.grpcPort }}"
  TOOL_PROXY_HEALTH_PORT: "{{ .Values.healthPort }}"
  RATE_LIMIT_RPM: "{{ .Values.rateLimitRpm | default 60 }}"
{{- end }}
