# =============================================================================
# E-GAOP Helm Values — Production Override
# =============================================================================
# Usage: helm install egaop . --values values.yaml --values values-production.yaml
# =============================================================================

global:
  environment: production

# ─── TLS / cert-manager ─────────────────────────────────────────────────────
tls:
  certManager:
    enabled: true

# ─── Service TLS (enable cert-manager for all services) ─────────────────────
api-server:
  tls:
    certManager:
      enabled: true
secret-store:
  tls:
    certManager:
      enabled: true
workflow-engine:
  tls:
    certManager:
      enabled: true
llm-router:
  tls:
    certManager:
      enabled: true
tool-proxy:
  tls:
    certManager:
      enabled: true
sandbox-runtime:
  tls:
    certManager:
      enabled: true
memory-plane:
  tls:
    certManager:
      enabled: true
observability-plane:
  tls:
    certManager:
      enabled: true
admin-console:
  tls:
    certManager:
      enabled: true

# ─── External Secrets Operator (required in production) ─────────────────────
externalSecrets:
  enabled: true
  vault:
    address: "https://vault.egaop.io:8200"
    path: "secret/data/egaop"
    kubernetesMountPath: "kubernetes"
    kubernetesRole: "egaop"
    secretsPath: "secret/data/egaop"

# ─── Redis HA (Sentinel) ────────────────────────────────────────────────────
redis:
  architecture: replication
  sentinel:
    enabled: true
    masterSet: egaop-master
    quorum: 2
  replica:
    replicaCount: 3
    persistence:
      size: 10Gi
      enabled: true
      storageClass: fast-ssd

# ─── PostgreSQL HA ──────────────────────────────────────────────────────────
postgresql:
  primary:
    persistence:
      size: 50Gi
      enabled: true
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
  readReplicas:
    name: read
    replicaCount: 2
    persistence:
      size: 50Gi
      enabled: true
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

# ─── Temporal HA ────────────────────────────────────────────────────────────
temporal:
  server:
    replicaCount: 3
    persistence:
      size: 20Gi
      enabled: true
      storageClass: fast-ssd

# ─── Service Replicas (HA) ──────────────────────────────────────────────────
defaults:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

api-server:
  replicas: 3
secret-store:
  replicas: 2
workflow-engine:
  replicas: 2
  sandboxIsolationLevel: "Enhanced"
llm-router:
  replicas: 2
  rateLimitRpm: 60
  anthropicBaseUrl: "https://api.anthropic.com"
  ollamaBaseUrl: "http://localhost:11434"
tool-proxy:
  replicas: 2
sandbox-runtime:
  replicas: 2
memory-plane:
  replicas: 2
observability-plane:
  replicas: 2
admin-console:
  replicas: 2
