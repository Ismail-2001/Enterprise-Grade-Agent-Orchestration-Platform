{{- if and .Values.enabled .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-letsencrypt-prod
  labels:
    app.kubernetes.io/name: egaop
    app.kubernetes.io/component: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email | default "platform@egaop.dev" }}
    privateKeySecretRef:
      name: {{ .Release.Name }}-letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.class | default "nginx" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-letsencrypt-staging
  labels:
    app.kubernetes.io/name: egaop
    app.kubernetes.io/component: cert-manager
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email | default "platform@egaop.dev" }}
    privateKeySecretRef:
      name: {{ .Release.Name }}-letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.class | default "nginx" }}
{{- end }}
