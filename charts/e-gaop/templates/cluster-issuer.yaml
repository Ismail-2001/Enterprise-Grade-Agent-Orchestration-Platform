{{- if .Values.ingress.certManagerIssuer }}
# ─── Public TLS ClusterIssuer (Let's Encrypt) ────────────────────────────────
# Used by the ingress hosts for admin.egaop.dev / api.egaop.dev / grpc.egaop.dev.
# Requires cert-manager to be installed cluster-wide.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.certManagerIssuer }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.ingress.certManagerEmail | default "admin@egaop.dev" }}
    privateKeySecretRef:
      name: {{ .Values.ingress.certManagerIssuer }}-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className | default "nginx" }}
{{- end }}
