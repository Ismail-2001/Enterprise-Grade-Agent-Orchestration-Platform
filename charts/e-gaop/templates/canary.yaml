{{- if .Values.canary.enabled }}
# ═══════════════════════════════════════════════════════════════════════════════
# Canary Deployment — runs alongside the stable Deployment
# Traffic is split via Istio VirtualService (if istioEnabled) or weighted labels.
# ═══════════════════════════════════════════════════════════════════════════════
{{- range $svc := .Values.canary.services }}
{{- if index $svc "enabled" | default true }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $svc.name }}-canary
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: e-gaop
    app.kubernetes.io/variant: canary
  annotations:
    e-gaop/canary-weight: "{{ $svc.weight | default 10 }}"
spec:
  replicas: {{ $svc.canaryReplicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/variant: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: e-gaop
        app.kubernetes.io/variant: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.healthPort | default 15051 }}"
    spec:
      serviceAccountName: {{ $.Release.Name }}-e-gaop-app
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: {{ $svc.name }}-canary
          image: "{{ $svc.image }}:{{ $svc.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-e-gaop-shared
          ports:
            - containerPort: {{ $svc.grpcPort | default 50051 }}
              name: grpc
              protocol: TCP
            - containerPort: {{ $svc.healthPort | default 15051 }}
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
{{- end }}

{{- if .Values.canary.istioEnabled }}
# ═══════════════════════════════════════════════════════════════════════════════
# Istio VirtualService — splits traffic between stable and canary
# ═══════════════════════════════════════════════════════════════════════════════
{{- range $svc := .Values.canary.services }}
{{- if index $svc "enabled" | default true }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $.Release.Name }}-{{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  hosts:
    - {{ $.Release.Name }}-{{ $svc.name }}
  http:
    - route:
        - destination:
            host: {{ $.Release.Name }}-{{ $svc.name }}
            subset: stable
          weight: {{ sub 100 ($svc.weight | default 10) }}
        - destination:
            host: {{ $.Release.Name }}-{{ $svc.name }}
            subset: canary
          weight: {{ $svc.weight | default 10 }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ $.Release.Name }}-{{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  host: {{ $.Release.Name }}-{{ $svc.name }}
  subsets:
    - name: stable
      labels:
        app.kubernetes.io/variant: stable
    - name: canary
      labels:
        app.kubernetes.io/variant: canary
{{- end }}
{{- end }}
{{- end }}
{{- end }}
