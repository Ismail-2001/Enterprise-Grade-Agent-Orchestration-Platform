name: CI
run-name: "CI ${{ github.ref_name }} — ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  #############################################################################
  # PREFLIGHT — fast checks that can fail early
  #############################################################################
  audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting (extraction bug workaround)
        run: |
          npm dedupe
          # npm 11 (Node 24) bug: npm ci creates package dirs but omits build/
          # content for many @opentelemetry/* and @grpc/* transitive deps.
          # Directly verify a known-cache-critical transitive dep and retry
          # npm dedupe until it's fully extracted (up to 10 passes).
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
          # Final verification (won't fail the step, but will surface in logs)
          test -f node_modules/@grpc/proto-loader/build/src/index.js || \
            echo "WARN: @grpc/proto-loader still incomplete after repair loop"
      - run: npm audit --audit-level=critical
      - name: Check for .env.example drift
        run: |
          if [ -f .env.example ]; then
            diff <(sort .env.example) <(git ls-files '*.env.example' | xargs sort 2>/dev/null) || true
            echo "ℹ .env.example exists — verify it stays in sync with .env"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting (extraction bug workaround)
        run: |
          npm dedupe
          # npm 11 (Node 24) bug: npm ci creates package dirs but omits build/
          # content for many @opentelemetry/* and @grpc/* transitive deps.
          # Directly verify a known-cache-critical transitive dep and retry
          # npm dedupe until it's fully extracted (up to 10 passes).
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
          # Final verification (won't fail the step, but will surface in logs)
          test -f node_modules/@grpc/proto-loader/build/src/index.js || \
            echo "WARN: @grpc/proto-loader still incomplete after repair loop"
      - run: npm run lint --workspaces --if-present

  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting (extraction bug workaround)
        run: |
          npm dedupe
          # npm 11 (Node 24) bug: npm ci creates package dirs but omits build/
          # content for many @opentelemetry/* and @grpc/* transitive deps.
          # Directly verify a known-cache-critical transitive dep and retry
          # npm dedupe until it's fully extracted (up to 10 passes).
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
          # Final verification (won't fail the step, but will surface in logs)
          test -f node_modules/@grpc/proto-loader/build/src/index.js || \
            echo "WARN: @grpc/proto-loader still incomplete after repair loop"
      - run: npm run build --workspace=packages/shared
      - run: npm run typecheck --workspaces --if-present

  helm-lint:
    name: Helm Chart
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Helm dependency update
        run: helm dependency update charts/e-gaop --skip-refresh || echo "Using pre-packaged chart dependencies"
      - name: Helm lint
        run: helm lint charts/e-gaop --strict
      - name: Helm template (defaults)
        run: helm template test charts/e-gaop --values charts/e-gaop/values.yaml > /dev/null
      - name: Helm template (staging)
        run: |
          helm template test charts/e-gaop \
            --values charts/e-gaop/values.yaml \
            --values charts/e-gaop/values-staging.yaml > /dev/null
      - name: Helm template (production)
        run: |
          helm template test charts/e-gaop \
            --values charts/e-gaop/values.yaml \
            --values charts/e-gaop/values-production.yaml > /dev/null
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate manifests with kubeconform
        run: |
          helm template test charts/e-gaop \
            --values charts/e-gaop/values.yaml \
            --values charts/e-gaop/values-production.yaml \
            | kubeconform -strict -output json \
            | jq -r '.validations[] | "\(.status) \(.resource.kind)/\(.resource.name)"' \
            | head -50
          echo "Validation complete"

  #############################################################################
  # TESTS
  #############################################################################
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting (extraction bug workaround)
        run: |
          npm dedupe
          # npm 11 (Node 24) bug: npm ci creates package dirs but omits build/
          # content for many @opentelemetry/* and @grpc/* transitive deps.
          # Directly verify a known-cache-critical transitive dep and retry
          # npm dedupe until it's fully extracted (up to 10 passes).
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
          # Final verification (won't fail the step, but will surface in logs)
          test -f node_modules/@grpc/proto-loader/build/src/index.js || \
            echo "WARN: @grpc/proto-loader still incomplete after repair loop"
      - run: npm run build --workspace=packages/shared
      - run: npm test --workspaces --if-present -- --passWithNoTests --coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/coverage/lcov.info
            **/coverage/coverage-summary.json
          retention-days: 14
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/junit.xml
            **/test-results.json
          retention-days: 14

  test-migrations:
    name: Migration Verification
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egaop
          POSTGRES_PASSWORD: ci-migration-test-pass
          POSTGRES_DB: egaop_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: egaop_migration_test
      POSTGRES_USER: egaop
      POSTGRES_PASSWORD: ci-migration-test-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting
        run: |
          npm dedupe
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
      - name: Apply migrations (up)
        run: node scripts/migrate.mjs up
      - name: Verify status (should be clean)
        run: node scripts/migrate.mjs status
      - name: Rollback all migrations (down)
        run: node scripts/migrate.mjs down --count=100
      - name: Re-apply migrations (up again)
        run: node scripts/migrate.mjs up
      - name: Final status check
        run: node scripts/migrate.mjs status

  test-cross-cutting:
    name: Cross-Cutting Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egaop
          POSTGRES_PASSWORD: egaop-test
          POSTGRES_DB: egaop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: egaop
      POSTGRES_PASSWORD: egaop-test
      POSTGRES_DB: egaop_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting (extraction bug workaround)
        run: |
          npm dedupe
          # npm 11 (Node 24) bug: npm ci creates package dirs but omits build/
          # content for many @opentelemetry/* and @grpc/* transitive deps.
          # Directly verify a known-cache-critical transitive dep and retry
          # npm dedupe until it's fully extracted (up to 10 passes).
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
          # Final verification (won't fail the step, but will surface in logs)
          test -f node_modules/@grpc/proto-loader/build/src/index.js || \
            echo "WARN: @grpc/proto-loader still incomplete after repair loop"
      - run: npm run build --workspace=packages/shared
      - name: Run contract tests
        run: npx jest --config "${{ github.workspace }}/tests/jest.config.ts" --selectProjects contract --passWithNoTests --forceExit
      - name: Run chaos tests
        run: npx jest --config "${{ github.workspace }}/tests/jest.config.ts" --selectProjects chaos --passWithNoTests --forceExit
      - name: Run security tests
        run: npx jest --config "${{ github.workspace }}/tests/jest.config.ts" --selectProjects security --passWithNoTests --forceExit

  load-test:
    name: Load Test (k6 smoke)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egaop
          POSTGRES_PASSWORD: ci-loadtest-postgres-pass
          POSTGRES_DB: egaop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: egaop_test
      POSTGRES_USER: egaop
      POSTGRES_PASSWORD: ci-loadtest-postgres-pass
      POSTGRES_URL: postgresql://egaop:ci-loadtest-postgres-pass@localhost:5432/egaop_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ci-loadtest-redis-pass-placeholder
      TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-fund
      - name: Repair npm 11 hoisting (extraction bug workaround)
        run: |
          npm dedupe
          # npm 11 (Node 24) bug: npm ci creates package dirs but omits build/
          # content for many @opentelemetry/* and @grpc/* transitive deps.
          # Directly verify a known-cache-critical transitive dep and retry
          # npm dedupe until it's fully extracted (up to 10 passes).
          for i in $(seq 1 10); do
            test -f node_modules/@grpc/proto-loader/build/src/index.js && break
            npm dedupe
          done
          # Final verification (won't fail the step, but will surface in logs)
          test -f node_modules/@grpc/proto-loader/build/src/index.js || \
            echo "WARN: @grpc/proto-loader still incomplete after repair loop"
      - name: Generate test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "EGAOP_MASTER_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OPENAI_API_KEY=sk-ci-loadtest-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "GRAFANA_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build shared package
        run: npm run build --workspace=packages/shared
      - name: Apply database migrations
        run: node scripts/migrate.mjs up
      - name: Build API server
        run: npm run build -w control-plane/api-server
      - name: Start API server
        run: |
          nohup node control-plane/api-server/dist/index.js > /tmp/api-server.log 2>&1 &
          echo "api-server pid: $!"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health > /dev/null 2>&1; then
              echo "api-server is up after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "api-server failed to become healthy"
          tail -100 /tmp/api-server.log
          exit 1
      - name: Run k6 smoke load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/ci-smoke.js
          flags: -e BASE_URL=http://localhost:3001 --summary-export=results/k6-summary.json
      - name: Show API server log (on failure)
        if: failure()
        run: tail -100 /tmp/api-server.log
      - name: Upload k6 summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: results/k6-summary.json
          retention-days: 14

  #############################################################################
  # BUILD — Docker images (parallel matrix)
  #############################################################################
  docker-build:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [test-unit, test-cross-cutting, helm-lint]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-server
          - secret-store
          - workflow-engine
          - llm-router
          - tool-proxy
          - sandbox-runtime
          - memory-plane
          - observability-plane
          - admin-console
    steps:
      - uses: actions/checkout@v4
      - name: Map Dockerfile path
        id: paths
        run: |
          case "${{ matrix.service }}" in
            api-server)       echo "df=control-plane/api-server/Dockerfile" ;;
            secret-store)     echo "df=control-plane/secret-store/Dockerfile" ;;
            workflow-engine)  echo "df=control-plane/workflow-engine/Dockerfile" ;;
            llm-router)       echo "df=execution-plane/llm-router/Dockerfile" ;;
            tool-proxy)       echo "df=execution-plane/tool-proxy/Dockerfile" ;;
            sandbox-runtime)  echo "df=execution-plane/sandbox-runtime/Dockerfile" ;;
            memory-plane)     echo "df=memory-plane/Dockerfile" ;;
            observability-plane) echo "df=observability-plane/Dockerfile" ;;
            admin-console)    echo "df=admin-console/Dockerfile" ;;
          esac >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Lowercase repository name
        id: registry
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.paths.outputs.df }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.repo }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.repo }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [lint, typecheck]
    env:
      POSTGRES_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-secret
      EGAOP_MASTER_ENCRYPTION_KEY: ci-test-key
      OPENAI_API_KEY: ci-test-key
      GRAFANA_PASSWORD: ci-test-password
      INTERNAL_SERVICE_TOKEN: ci-test-token
      REDIS_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          for f in compose.yaml compose.yml docker-compose.yml docker-compose.yaml; do
            if [ -f "$f" ]; then
              echo "Validating $f..."
              docker compose -f "$f" config > /dev/null
            fi
          done

  #############################################################################
  # INTEGRATION — kind cluster deploy + health-check (main only)
  #############################################################################
  kind-deploy:
    name: Kind Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: github.event_name == 'push'
    needs: [test-unit, test-cross-cutting, helm-lint, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: egaop-ci
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
              - role: control-plane
                extraPortMappings:
                  - containerPort: 3001
                    hostPort: 3001
                    protocol: TCP

      - name: Build Docker images
        run: |
          # Build all service images locally for kind loading
          # (cannot reuse GHCR images — kind clusters need local images)
          services=(
            "api-server:control-plane/api-server/Dockerfile"
            "secret-store:control-plane/secret-store/Dockerfile"
            "workflow-engine:control-plane/workflow-engine/Dockerfile"
            "llm-router:execution-plane/llm-router/Dockerfile"
            "tool-proxy:execution-plane/tool-proxy/Dockerfile"
            "sandbox-runtime:execution-plane/sandbox-runtime/Dockerfile"
            "memory-plane:memory-plane/Dockerfile"
            "observability-plane:observability-plane/Dockerfile"
            "admin-console:admin-console/Dockerfile"
          )
          for entry in "${services[@]}"; do
            svc="${entry%%:*}"
            df="${entry##*:}"
            echo "--- Building egaop/$svc:ci ---"
            docker build -f "$df" -t "egaop/$svc:ci" . || {
              echo "FAIL: $svc" >&2; exit 1
            }
          done
          # Build base-runtime (required by sandbox-runtime)
          echo "--- Building egaop-base-runtime:ci ---"
          docker build -f execution-plane/sandbox-runtime/base-runtime/Dockerfile \
            -t egaop-base-runtime:ci .

      - name: Load images into kind
        run: |
          images=(
            egaop/api-server:ci
            egaop/secret-store:ci
            egaop/workflow-engine:ci
            egaop/llm-router:ci
            egaop/tool-proxy:ci
            egaop/sandbox-runtime:ci
            egaop/memory-plane:ci
            egaop/observability-plane:ci
            egaop/admin-console:ci
            egaop-base-runtime:ci
          )
          for img in "${images[@]}"; do
            echo "Loading $img..."
            kind load docker-image --name egaop-ci "$img"
          done

      - name: Helm dependency update
        run: helm dependency update charts/e-gaop --skip-refresh || echo "Using pre-packaged chart dependencies"

      - name: Deploy to kind cluster
        run: |
          helm upgrade egaop-test charts/e-gaop \
            --namespace default \
            --install \
            --wait \
            --timeout 5m \
            --set api-server.image=egaop/api-server --set api-server.tag=ci \
            --set secret-store.image=egaop/secret-store --set secret-store.tag=ci \
            --set workflow-engine.image=egaop/workflow-engine --set workflow-engine.tag=ci \
            --set llm-router.image=egaop/llm-router --set llm-router.tag=ci \
            --set tool-proxy.image=egaop/tool-proxy --set tool-proxy.tag=ci \
            --set sandbox-runtime.image=egaop/sandbox-runtime --set sandbox-runtime.tag=ci \
            --set memory-plane.image=egaop/memory-plane --set memory-plane.tag=ci \
            --set observability-plane.image=egaop/observability-plane --set observability-plane.tag=ci \
            --set admin-console.image=egaop/admin-console --set admin-console.tag=ci \
            --set api-server.hpa.enabled=false \
            --set secret-store.hpa.enabled=false \
            --set workflow-engine.hpa.enabled=false \
            --set llm-router.hpa.enabled=false \
            --set tool-proxy.hpa.enabled=false \
            --set sandbox-runtime.hpa.enabled=false \
            --set memory-plane.hpa.enabled=false \
            --set observability-plane.hpa.enabled=false \
            --set admin-console.hpa.enabled=false

      - name: Wait for deployments
        run: |
          echo "Waiting for all deployments to roll out..."
          kubectl rollout status deployment/egaop-test-api-server       --timeout=120s
          kubectl rollout status deployment/egaop-test-secret-store     --timeout=120s
          kubectl rollout status deployment/egaop-test-workflow-engine  --timeout=120s
          kubectl rollout status deployment/egaop-test-llm-router       --timeout=120s
          kubectl rollout status deployment/egaop-test-tool-proxy       --timeout=120s
          kubectl rollout status deployment/egaop-test-sandbox-runtime  --timeout=120s
          kubectl rollout status deployment/egaop-test-memory-plane     --timeout=120s
          kubectl rollout status deployment/egaop-test-observability-plane --timeout=120s
          kubectl rollout status deployment/egaop-test-admin-console    --timeout=120s

      - name: Health-check pods
        run: |
          echo "=== Pod status ==="
          kubectl get pods -o wide
          echo ""
          # Fail if any pod is in CrashLoopBackOff, Error, or Pending
          bad=$(kubectl get pods --no-headers 2>&1 \
            | grep -E "CrashLoopBackOff|Error|Pending|Init:Error" || true)
          if [ -n "$bad" ]; then
            echo "FAIL: Unhealthy pods detected:"
            echo "$bad"
            exit 1
          fi
          echo "All pods healthy"

      - name: Health-check API endpoint
        run: |
          echo "Waiting for api-server to become ready on :3001..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health > /dev/null 2>&1; then
              echo "api-server healthy after ${i} attempts"
              curl -fsS http://localhost:3001/health
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: api-server did not become healthy"
          kubectl logs deployment/egaop-test-api-server --tail=50
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          for deploy in api-server secret-store workflow-engine llm-router tool-proxy \
                         sandbox-runtime memory-plane observability-plane admin-console; do
            echo "--- egaop-test-$deploy ---"
            kubectl logs "deployment/egaop-test-$deploy" --tail=20 2>/dev/null || true
          done

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name egaop-ci

  #############################################################################
  # SUMMARY
  #############################################################################
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    if: always()
    needs: [audit, lint, typecheck, helm-lint, test-unit, test-migrations, test-cross-cutting, load-test, docker-build, docker-compose-validate, kind-deploy]
    steps:
      - run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | ${{ needs.audit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeCheck | ${{ needs.typecheck.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Lint | ${{ needs.helm-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.test-migrations.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Cutting | ${{ needs.test-cross-cutting.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Test (k6) | ${{ needs.load-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images | ${{ needs.docker-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compose Validate | ${{ needs.docker-compose-validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kind Deploy | ${{ needs.kind-deploy.result == 'success' && '✅' || (needs.kind-deploy.result == 'skipped' && '⏭️') || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
