apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: egaop-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: egaop
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: egaop

  source:
    repoURL: https://github.com/Ismail-2001/The-Kubernetes-of-AI-Agents
    targetRevision: main
    path: charts/e-gaop
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: egaop-production

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 20

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas
    - group: policy
      kind: PodDisruptionBudget
      jqPathExpressions:
        - .spec.minAvailable
